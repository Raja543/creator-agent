name: Process Events

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Classify tweets into events
        run: |
          curl -s -X GET "${{ secrets.APP_URL }}/api/pipeline/process" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 540 \
            -w "\nStatus: %{http_code}" \
            -o /dev/stdout
